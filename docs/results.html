<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Results · Lending Desk Bench</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./assets/css/site.css" />
  <script src="./assets/js/chart.umd.min.js"></script>
</head>
<body>
  <nav class="site-nav">
    <div class="wrap inner">
      <a class="brand" href="./"><span class="brand-mark"></span> Lending Desk Bench</a>
      <div class="nav-links">
        <a href="./">Overview</a>
        <a href="./methodology.html">Methodology</a>
        <a class="active" href="./results.html">Results</a>
        <a href="./models/">Models</a>
      </div>
    </div>
  </nav>

  <header class="hero wrap">
    <p class="kicker">Results</p>
    <h1>No Skills matrix</h1>
    <p class="lede">
      The table shows soft scores, pass counts, run time, cost, cache hit rate, and tokens.
      Click a column header to sort. The domain heatmap shows strong and weak areas for each model.
    </p>
  </header>

  <main class="wrap stack" id="main">
    <div class="loading">Loading results…</div>
  </main>

  <footer class="site-footer wrap"></footer>

  <script type="module">
    import {
      loadData, fmtTokens, fmtUsd, fmtMonthlyPct, fmtSecs, fmtPct1, pct, domainRate, DOMAIN_ORDER,
      modelColor, chartDefaults, mountError, setActiveNav, escapeHtml, cacheHitRate, initSortable,
    } from "./assets/js/site.js";

    setActiveNav();
    const main = document.getElementById("main");

    try {
      const data = await loadData();
      const models = data.models;
      const { grid } = chartDefaults();

      const domainKeys = DOMAIN_ORDER.filter((d) =>
        models.some((m) => m.domains?.[d])
      );

      main.innerHTML = `
        <section class="card">
          <h2>Score &amp; economics</h2>
          <div class="grid-2 mt-1">
            <div class="chart-box"><canvas id="chart-scores"></canvas></div>
            <div class="chart-box"><canvas id="chart-run-time"></canvas></div>
          </div>
          <div class="table-wrap mt-2">
            <table class="data" id="full-table">
              <thead>
                <tr>
                  <th class="num">#</th>
                  <th data-col="name">Model</th>
                  <th class="num" data-col="score">Score</th>
                  <th class="num" data-col="passes">Passes</th>
                  <th class="num" data-col="runtime">Run time</th>
                  <th class="num" data-col="monthly">% monthly</th>
                  <th class="num" data-col="cache" title="Cache reads as a share of prompt tokens (cache reads plus new input)">Cache hit</th>
                  <th class="num" data-col="in" title="New input tokens only. Cache reads are counted in the Cache hit column, and providers differ in how they split the two.">Uncached input</th>
                  <th class="num" data-col="out">Out</th>
                  <th class="num">Reasoning</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </section>

        <section class="card">
          <h2>Domain heatmap</h2>
          <p class="section-lede">The value is the pass rate for each domain. A high value means more passed checks.</p>
          <div class="table-wrap">
            <table class="matrix" id="heatmap"></table>
          </div>
          <div class="chart-box tall mt-2"><canvas id="chart-domains"></canvas></div>
        </section>

        <section class="card" id="arm-b-note"></section>
      `;

      // Table
      document.querySelector("#full-table tbody").innerHTML = models.map((m, i) => {
        const cache = cacheHitRate(m.usage);
        // SCORING.md: a record that fails a trust flag must not be ranked. Publish the
        // total, but say plainly that it does not count.
        const t = m.trust;
        const unranked = t && !t.rankable;
        const why = !t ? "" : t.under_load
          ? "graded while the host was busy"
          : !t.valid ? "the run is invalid" : "a trust flag failed";
        return `
        <tr data-sort-name="${escapeHtml(m.name)}" data-sort-score="${m.score.total}"
            data-sort-passes="${m.passes.passed / m.passes.total}"
            data-sort-runtime="${m.wall_seconds ?? ""}"
            data-sort-monthly="${m.go?.monthly_pct ?? ""}"
            data-sort-cache="${cache ?? ""}"
            data-sort-in="${m.usage.input ?? ""}"
            data-sort-out="${m.usage.output ?? ""}">
          <td class="num">${i + 1}</td>
          <td>
            <a class="model-link" href="./models/${m.id}.html">${escapeHtml(m.name)}</a>
            <div class="subline">${escapeHtml(m.provider_model)}</div>
          </td>
          <td class="num score">${m.score.total.toFixed(1)}${
            unranked ? `<span class="unranked" title="Unranked: ${why}.">unranked</span>` : ""
          }</td>
          <td class="num">${m.passes.passed}/${m.passes.total}</td>
          <td class="num">${fmtSecs(m.wall_seconds)}</td>
          <td class="num">${fmtMonthlyPct(m.go?.monthly_pct)}</td>
          <td class="num">${fmtPct1(cache)}</td>
          <td class="num">${fmtTokens(m.usage.input)}</td>
          <td class="num">${fmtTokens(m.usage.output)}</td>
          <td class="num">${escapeHtml(m.thinking || "—")}</td>
        </tr>
      `; }).join("");
      initSortable(document.getElementById("full-table"), { renumber: true });

      // Heatmap
      const heat = document.getElementById("heatmap");
      heat.innerHTML = `
        <thead><tr><th>Model</th>${domainKeys.map((d) => `<th title="${escapeHtml(data.domains[d]?.title || d)}">${d}</th>`).join("")}</tr></thead>
        <tbody>
          ${models.map((m, i) => `
            <tr>
              <th scope="row">${escapeHtml(m.name)}</th>
              ${domainKeys.map((d) => {
                const rate = domainRate(m, d);
                const cls = rate >= 0.95 ? "cell-good" : rate >= 0.75 ? "cell-ok" : rate >= 0.5 ? "cell-mid" : rate > 0 ? "cell-bad" : "cell-dead";
                return `<td class="${cls}">${pct(rate)}</td>`;
              }).join("")}
            </tr>
          `).join("")}
        </tbody>
      `;

      const note = document.getElementById("arm-b-note");
      note.innerHTML = `
        <h2>Skills runs</h2>
        <p class="section-lede">The same models with AGENTS.md and five skills. Do not mix these scores into the No Skills ranking.</p>
        <ul class="muted" style="padding-left:1.15rem">
          ${models.filter((m) => m.skills).map((m) => `
            <li><strong>${escapeHtml(m.name)}</strong> — Skills score ${m.skills.score.total.toFixed(1)},
            ${fmtMonthlyPct(m.skills.go?.monthly_pct)} monthly</li>
          `).join("") || "<li>No Skills-arm runs yet.</li>"}
        </ul>
      `;

      if (typeof Chart !== "undefined") {
      new Chart(document.getElementById("chart-scores"), {
        type: "bar",
        data: {
          labels: models.map((m) => m.name),
          datasets: [{
            data: models.map((m) => m.score.total),
            backgroundColor: models.map((_, i) => modelColor(i)),
            borderRadius: 8,
            maxBarThickness: 48,
          }],
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            title: { display: true, text: "Soft score", color: "#e8eef6", font: { size: 14, weight: "600" } },
          },
          scales: {
            y: { beginAtZero: true, max: 100, grid: { color: grid } },
            x: { grid: { display: false }, ticks: { maxRotation: 35 } },
          },
        },
      });

      new Chart(document.getElementById("chart-run-time"), {
        type: "bar",
        data: {
          labels: models.map((m) => m.name),
          datasets: [{
            data: models.map((m) => Math.round((m.wall_seconds || 0) / 60)),
            backgroundColor: models.map((_, i) => modelColor(i)),
            borderRadius: 8,
            maxBarThickness: 48,
          }],
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            title: { display: true, text: "Run time (minutes)", color: "#e8eef6", font: { size: 14, weight: "600" } },
          },
          scales: {
            y: { beginAtZero: true, grid: { color: grid } },
            x: { grid: { display: false }, ticks: { maxRotation: 35 } },
          },
        },
      });

      new Chart(document.getElementById("chart-domains"), {
        type: "bar",
        data: {
          labels: domainKeys,
          datasets: models.map((m, i) => ({
            label: m.name,
            data: domainKeys.map((d) => Math.round(100 * domainRate(m, d))),
            backgroundColor: modelColor(i),
            borderRadius: 4,
            maxBarThickness: 16,
          })),
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: {
            title: { display: true, text: "Domain pass rates (%)", color: "#e8eef6", font: { size: 14, weight: "600" } },
            legend: { position: "bottom", labels: { boxWidth: 10 } },
          },
          scales: {
            y: { beginAtZero: true, max: 100, grid: { color: grid } },
            x: { grid: { display: false } },
          },
        },
      });
      }
    } catch (err) {
      mountError(main, err);
    }
  </script>
</body>
</html>
